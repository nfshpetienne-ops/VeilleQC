<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les infos QC — Veille technologique</title>
  <meta name="description" content="Agrégateur de veille technologique — Android, iOS, QA/QC, IA Testing, Privacy & Légal" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- localforage (IndexedDB) via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>

  <!-- Favicon SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235b73f5'/><text y='.9em' font-size='70' x='10'>📡</text></svg>" />
</head>
<body>

<div id="refresh-progress"></div>

<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header id="header">
    <!-- Bouton hamburger (mobile) -->
    <button class="header-btn" id="sidebar-toggle" onclick="App.toggleSidebar()" aria-label="Menu" style="display:none">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>

    <!-- Logo -->
    <a class="logo" href="#">
      <div class="logo-icon">QC</div>
      <span>Les infos QC</span>
    </a>

    <!-- Recherche -->
    <div class="header-search">
      <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input"
             placeholder="Rechercher… (/ pour focus)"
             autocomplete="off" spellcheck="false" />
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button class="refresh-btn" id="refresh-btn" onclick="App.refresh()" title="Rafraîchir (R)">
        <svg class="refresh-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        <span>Rafraîchir</span>
      </button>

      <button class="header-btn" id="theme-btn" onclick="App.toggleTheme()" title="Changer de thème (T)">
        <!-- Moon = dark mode actif -->
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Body ───────────────────────────────────────────────────────────── -->
  <div id="body">

    <!-- Overlay mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="App.toggleSidebar()"></div>

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Catégories</div>
        <div id="sidebar-categories">
          <!-- Rendu par app.js / ui.js -->
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Filtres rapides</div>

        <div class="sidebar-item" onclick="App.toggleHideRead()">
          <svg class="item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span class="item-label">Masquer les lus</span>
        </div>

        <div class="sidebar-item" onclick="App.toggleBookmarksOnly()">
          <svg class="item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
          </svg>
          <span class="item-label">Sauvegardés</span>
        </div>
      </div>

      <!-- Raccourcis -->
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Raccourcis clavier</div>
        <div style="padding:4px 16px 8px;font-size:.72rem;color:var(--text-tertiary);line-height:2">
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">R</code> Rafraîchir &nbsp;
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">T</code> Thème<br>
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">/</code> Recherche &nbsp;
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">1–5</code> Catégorie<br>
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">0</code> Toutes &nbsp;
          <code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:.7rem">Esc</code> Effacer
        </div>
      </div>

      <!-- Mots-clés bloqués (rendu dynamiquement) -->
      <div id="blocked-keywords-section"></div>

      <!-- Stats -->
      <div style="margin-top:auto">
        <div class="sidebar-divider"></div>
        <div id="last-refresh" class="last-refresh"></div>
        <div id="sidebar-stats" class="sidebar-stats">0 articles</div>
      </div>
    </nav>

    <!-- ── Main ─────────────────────────────────────────────────────────── -->
    <main id="main">

      <!-- Toolbar filtres -->
      <div id="toolbar">
        <div class="filter-chips">
          <button class="filter-chip" data-filter="hideRead" onclick="App.toggleHideRead()">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            Masquer lus
          </button>
          <button class="filter-chip" data-filter="bookmarks" onclick="App.toggleBookmarksOnly()">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
            </svg>
            Sauvegardés
          </button>
        </div>

        <div class="toolbar-right">
          <select id="sort-select" class="sort-select"
                  onchange="App.setSortBy(this.value)">
            <option value="newest">Plus récents</option>
            <option value="oldest">Plus anciens</option>
            <option value="source">Source A–Z</option>
          </select>

          <div class="view-toggle">
            <button class="view-btn active" data-view="comfortable"
                    onclick="App.setViewMode('comfortable')" title="Vue confortable">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="5" rx="1"/>
                <rect x="3" y="10" width="18" height="5" rx="1"/>
                <rect x="3" y="17" width="18" height="4" rx="1"/>
              </svg>
            </button>
            <button class="view-btn" data-view="compact"
                    onclick="App.setViewMode('compact')" title="Vue compacte">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="3" y1="14" x2="21" y2="14"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Liste des articles -->
      <div id="article-list">
        <!-- Rendu par app.js -->
      </div>
    </main>

  </div><!-- /#body -->
</div><!-- /#app -->

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Scripts (ordre important : sources → fetcher → storage → ui → app) -->
<script src="js/sources.js"></script>
<script src="js/fetcher.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<!-- Responsive : afficher le hamburger sur mobile -->
<script>
  (function() {
    const btn = document.getElementById('sidebar-toggle');
    if (btn && window.innerWidth <= 768) btn.style.display = 'flex';
    window.addEventListener('resize', () => {
      if (btn) btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
    });
  })();
</script>

</body>
</html>
